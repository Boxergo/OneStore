<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6e56">
<meta name="mobile-web-app-capable" content="yes">
<title>SatuToko POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo"><img src="icon.svg" width="40" height="40" alt=""></div>
    <h2>SatuToko POS</h2>
    <p class="muted small" style="margin-top:0">Satu sistem untuk semua toko & cabang Anda.</p>
    <label>Username</label><input name="username" required autocapitalize="off" autocomplete="username">
    <label>Password</label><input name="password" type="password" required autocomplete="current-password">
    <div id="loginErr" class="alert bad hidden" style="margin-top:.7rem"></div>
    <button class="btn block" style="margin-top:1rem">Masuk</button>
    <p class="muted small" style="margin-bottom:0">Demo: owner/owner123 · admin/admin123 · spv/spv123 · kasir/kasir123</p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header id="top">
    <div class="title" id="appTitle">SatuToko</div>
    <span id="netPill" class="pill">Online</span>
    <span id="queuePill" class="pill q hidden"></span>
    <select id="storeSel" class="hidden" aria-label="Pilih toko"></select>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<div id="modal" class="hidden"><div class="box"><div class="mh"><h2 id="mTitle"></h2><button class="x" aria-label="Tutup">&times;</button></div><div id="mBody"></div></div></div>
<div id="toast" class="hidden"></div>
<div id="printArea" aria-hidden="true"></div>

<script src="barcode.js"></script>
<script src="app.js"></script>
</body>
</html>
